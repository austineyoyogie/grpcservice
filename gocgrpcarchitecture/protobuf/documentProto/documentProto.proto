syntax = "proto3";

package protobuf.documentProto;  // Protobuf Namespace

option go_package = "gocgrpcarchitecture/generate/proto/documentProto";
import "google/protobuf/timestamp.proto";
//import "google/protobuf/wrappers.proto";


service DocumentService {
  rpc UploadDocument(stream UploadRequest) returns (UploadResponse);
  rpc DownloadDocument(DownloadRequest) returns (stream DownloadResponse);
  rpc GetDocument(GetRequest) returns (GetResponse);
  rpc UpdateDocument(UpdateRequest) returns (UpdateResponse);
  rpc DeleteDocument(DeleteRequest) returns (DeleteResponse);
}

message UploadRequest {
  oneof data {
    DocumentMetadata metadata = 1;
    bytes chunk_data = 2;
  }
}

message DocumentMetadata {
  string Id = 1;
  string Filename = 2;
  string Title = 3;
  uint64 Size  = 4;
  google.protobuf.Timestamp CreatedAt = 5;
  google.protobuf.Timestamp UpdatedAt = 6;
}

message UploadResponse {
    DocumentMetadata Metadata = 1;
}

message DownloadRequest {
  DocumentMetadata Metadata = 1;
}

message DownloadResponse {
  bytes chunk_data = 1;
}

message GetRequest {
  DocumentMetadata Metadata  = 1;
}
message GetResponse {
  DocumentMetadata Metadata  = 1;
}

message UpdateRequest {
  DocumentMetadata Metadata  = 1;
}
message UpdateResponse { bool success = 1; }

message DeleteRequest {  DocumentMetadata Metadata  = 1; }
message DeleteResponse { bool success = 1; }













